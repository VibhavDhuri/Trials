<!-- Options Trading Signals — app icon (256×256, dark theme) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background card -->
  <rect width="256" height="256" rx="40" fill="#0d1117"/>
  <!-- Grid lines (subtle) -->
  <line x1="32" y1="76"  x2="224" y2="76"  stroke="#1e2840" stroke-width="1"/>
  <line x1="32" y1="124" x2="224" y2="124" stroke="#1e2840" stroke-width="1"/>
  <line x1="32" y1="172" x2="224" y2="172" stroke="#1e2840" stroke-width="1"/>
  <!-- Bullish trend line (green) -->
  <polyline
    points="32,182 72,158 112,138 152,102 192,78 224,56"
    stroke="#00C851" stroke-width="5" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Candle 1 — red (wick + body) -->
  <line x1="52"  y1="167" x2="52"  y2="196" stroke="#e74c3c" stroke-width="2.5"/>
  <rect x="45"   y="175"  width="14" height="14" rx="2" fill="#e74c3c"/>
  <!-- Candle 2 — green -->
  <line x1="92"  y1="144" x2="92"  y2="174" stroke="#00C851" stroke-width="2.5"/>
  <rect x="85"   y="148"  width="14" height="16" rx="2" fill="#00C851"/>
  <!-- Candle 3 — red -->
  <line x1="132" y1="126" x2="132" y2="156" stroke="#e74c3c" stroke-width="2.5"/>
  <rect x="125"  y="130"  width="14" height="18" rx="2" fill="#e74c3c"/>
  <!-- Candle 4 — green -->
  <line x1="172" y1="86"  x2="172" y2="118" stroke="#00C851" stroke-width="2.5"/>
  <rect x="165"  y="90"   width="14" height="20" rx="2" fill="#00C851"/>
  <!-- Candle 5 — green -->
  <line x1="212" y1="58"  x2="212" y2="94"  stroke="#00C851" stroke-width="2.5"/>
  <rect x="205"  y="62"   width="14" height="22" rx="2" fill="#00C851"/>
  <!-- Label -->
  <text x="128" y="228"
        font-family="Arial,Helvetica,sans-serif"
        font-size="20" font-weight="bold"
        fill="#42A5F5" text-anchor="middle" letter-spacing="3">OPTIONS</text>
</svg>
